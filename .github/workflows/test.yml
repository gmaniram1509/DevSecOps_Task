name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  PYTHON_VERSION: '3.9'
  DJANGO_SETTINGS_MODULE: task_manager.settings

jobs:
  source-code:
    name: Source Code Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository structure
        run: |
          echo "✅ Repository checked out successfully"
          echo "📁 Repository contents:"
          ls -la

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: source-code
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.9']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
                  python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install coverage

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Run database migrations
        run: |
          python manage.py migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_manager_test

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test
          coverage report -m
          coverage xml -o coverage.xml
          coverage html
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_manager_test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          retention-days: 1

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Verify coverage file
        run: |
          echo "Coverage file contents:"
          ls -la
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml found"
            cat coverage.xml | head -20
          else
            echo "❌ coverage.xml not found"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build, sonarqube]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🔑 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            set -e

            echo "🚀 Deployment started at $(date)"

            # Navigate to application directory
            cd /opt/apps/Mani

            echo "📥 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 Activating virtual environment..."
            source venv/bin/activate

            echo "📦 Installing/Updating dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🗄️ Running database migrations..."
            python manage.py migrate --noinput

            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput

            echo "🔄 Restarting Gunicorn service..."
            sudo systemctl restart gunicorn

            echo "🔄 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "✅ Checking service status..."
            sudo systemctl status gunicorn --no-pager | grep "Active:"
            sudo systemctl status nginx --no-pager | grep "Active:"

            echo "🎉 Deployment completed successfully at $(date)!"
          ENDSSH

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem

      - name: 🔔 Deployment Success Notification
        if: success()
        run: |
          echo "✅ Deployment to EC2 completed successfully!"
          echo "🌐 Application URL: http://${{ secrets.EC2_HOST }}"

      - name: ❌ Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment failed! Please check the logs."
